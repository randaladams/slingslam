name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk SlingSlam.apk

      - uses: actions/upload-artifact@v7
        with:
          name: SlingSlam-apk
          path: SlingSlam.apk

      - name: Publish to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Sling Slam (latest build)
          body: "Build #${{ github.run_number }} from ${{ github.sha }}. Download SlingSlam.apk on your phone and open it to install."
          prerelease: false
          make_latest: true
          files: SlingSlam.apk
