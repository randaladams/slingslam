name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Write signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. Add SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/release.jks

      - name: Build APK and App Bundle
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # side-loaded APK: Google test ads; Play Store bundle: real ads
          ./gradlew assembleRelease --stacktrace
          ./gradlew bundleRelease -PplayStore --stacktrace
          cp app/build/outputs/apk/release/app-release.apk SlingSlam.apk
          cp app/build/outputs/bundle/release/app-release.aab SlingSlam.aab
          rm -f app/release.jks

      - uses: actions/upload-artifact@v7
        with:
          name: SlingSlam
          path: |
            SlingSlam.apk
            SlingSlam.aab

      - name: Publish to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Sling Slam (latest build)
          body: "Build #${{ github.run_number }} from ${{ github.sha }}. Download SlingSlam.apk on your phone and open it to install. SlingSlam.aab is the bundle to upload to Google Play."
          prerelease: false
          make_latest: true
          files: |
            SlingSlam.apk
            SlingSlam.aab
